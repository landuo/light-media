services:
  light-media:
    build: .
    image: light-media:local
    container_name: light-media
    restart: unless-stopped
    user: "1000:1001"
    ports:
      - "3120:3120"
    volumes:
      - ./data:/config
      - /vol2/1000/media:/media
      - /vol2/1000/media:/vol2/1000/media
    environment:
      TZ: Asia/Shanghai
      LIGHT_MEDIA_MEDIA_ROOTS: /media:/vol2/1000/media
      # The host defaults to 56 MiB of Go-managed memory and GOGC=200.
      # Set GOMEMLIMIT / GOGC here only for an explicit runtime override.
    # Host unit: deploy/systemd/lightmedia.slice (MemoryHigh=170000000 bytes).
    cgroup_parent: lightmedia.slice
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
